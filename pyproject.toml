[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stdvbot"
version = "0.1.0"
description = "Autonomous regime-gated reversal trading system"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.scripts]
stdvbot = "stdvbot.cli:main"

[tool.setuptools.packages.find]
include = ["stdvbot*"]
