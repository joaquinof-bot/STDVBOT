[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stdvbot"
version = "0.1.0"
description = "Multi-timeframe VWAP-swing / RSI / trendline killzone reversion strategy backtester"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["ccxt>=4.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["stdvbot*"]
